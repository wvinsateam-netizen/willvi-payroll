<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>윌앤비전 급여·노무 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>윌앤비전 급여·노무</b><span>경영지원본부 인사팀</span></div>
    <nav id="nav">
      <button data-v="home"><span class="k">00</span>홈</button>
      <button data-v="sites"><span class="k">01</span>급여기초<span class="cnt" id="c-sites">0</span></button>
      <button data-v="bills"><span class="k">02</span>청구 특이사항<span class="cnt" id="c-bills">0</span></button>
      <button data-v="notes"><span class="k">03</span>급여 특이사항<span class="cnt" id="c-notes">0</span></button>
      <button data-v="issues"><span class="k">04</span>노무 문제<span class="cnt" id="c-issues">0</span></button>
    </nav>
    <div class="side-foot"><div id="conn">이 브라우저에 저장됨</div>
      <div class="tools"><button class="btn sm" id="bkExport">엑셀로 저장</button><button class="btn sm" id="bkImport">백업 불러오기</button><button class="btn sm danger" id="bkReset">엑셀 원본으로 초기화</button></div>
      <input type="file" id="bkFile" accept=".json,application/json" hidden></div>
  </aside>
  <main id="main"></main>
</div>
<div id="drawer-root"></div>

<script src="data/seed-sites.js"></script>
<script src="js/config.local.js" onerror="void 0"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/store-supabase.js"></script>
<script src="js/app.js"></script>
</body>
</html>
